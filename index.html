<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffd6e8" />
    <title>Maria Helena, aceitas?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true" id="sky"></div>

    <main class="card">
      <figure class="portrait">
        <img src="assets/foto.png" alt="Foto dele, esperando a resposta" />
        <svg class="bow" viewBox="0 0 140 110" aria-hidden="true">
          <path
            d="M70 48c-6-22-28-34-46-24-16 9-18 30-6 42 8 8 22 10 34 6-4 10-2 24 8 30 8-8 10-22 10-32z"
          />
          <path
            d="M70 48c6-22 28-34 46-24 16 9 18 30 6 42-8 8-22 10-34 6 4 10 2 24-8 30-8-8-10-22-10-32z"
          />
          <circle cx="70" cy="52" r="12" />
          <path d="M58 62c-8 16-6 32 2 40" />
          <path d="M82 62c8 16 6 32-2 40" />
        </svg>
      </figure>

      <h1>
        <span class="name">Maria Helena,</span>
        <span class="ask">aceitas dar o caneco pra mim?</span>
        <span class="emojis" aria-hidden="true">💍👌🏻</span>
      </h1>

      <div class="actions">
        <button type="button" class="btn yes" id="yes">Sim</button>
        <button type="button" class="btn no" id="no">Não</button>
      </div>
      <p class="hint" id="hint"></p>
    </main>

    <section class="celebrate" id="celebrate" hidden>
      <p class="kicker">resposta oficial</p>
      <h2>Sim!</h2>
      <p class="love">
        Então tá combinado,<br />
        Maria Helena.<br />
        A gente vai dar o caneco. 💍
      </p>
    </section>

    <script src="script.js"></script>
  </body>
</html>
